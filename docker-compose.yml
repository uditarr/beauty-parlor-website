services:
  postgres:
    image: postgres:16-alpine
    container_name: beauty_parlor_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: beauty_parlor
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d beauty_parlor"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
